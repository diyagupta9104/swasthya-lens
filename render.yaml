services:
  - type: web
    name: ch23b012-edgechat-project
    runtime: python
    region: singapore
    plan: free
    repo: https://github.com/diyagupta9104/swasthya-lens
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
